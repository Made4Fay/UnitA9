<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNIT A9 — Reflective System of Minds</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>

<body>
  <main id="landing" class="scroll-landing">
    <div class="nebula-bg"></div>
    <canvas id="orbital-grid"></canvas>

    <div class="center-content">
      <!-- UNIT A9 Logo -->
      <svg id="ua9-logo" width="220" height="220" viewBox="0 0 220 220" aria-label="UNIT A9 Orbital Logo">
        <defs>
          <radialGradient id="ua9-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#dcd6ff" />
            <stop offset="100%" stop-color="#7ec8ff" />
          </radialGradient>
        </defs>

        <circle cx="110" cy="110" r="20" fill="url(#ua9-core)" />

        <g class="stroke-draw" stroke="#b8c7ff" stroke-width="0.8" opacity="0.6">
          <ellipse cx="110" cy="110" rx="20" ry="10"/>
          <ellipse cx="110" cy="110" rx="20" ry="10" transform="rotate(90 110 110)"/>
          <ellipse cx="110" cy="110" rx="20" ry="10" transform="rotate(45 110 110)"/>
          <ellipse cx="110" cy="110" rx="20" ry="10" transform="rotate(-45 110 110)"/>
        </g>

        <g class="nodes">
          <circle cx="110" cy="20" r="3"/>
          <circle cx="194" cy="110" r="3"/>
          <circle cx="110" cy="200" r="3"/>
          <circle cx="26" cy="110" r="3"/>
          <circle cx="54" cy="54" r="3"/>
          <circle cx="166" cy="54" r="3"/>
          <circle cx="166" cy="166" r="3"/>
          <circle cx="54" cy="166" r="3"/>
        </g>

        <path class="stroke-draw"
          d="M60,110 C60,60 160,60 160,110 C160,160 60,160 60,110 Z"
          stroke="url(#ua9-core)" stroke-width="3" fill="none" opacity="0.3"/>
      </svg>

      <h1 class="title">UNIT A9</h1>
      <p class="subtitle">Reflective System of Minds</p>
      <div class="scroll-cue"></div>
    </div>

    <!-- Ambient Pixie Field -->
    <div id="pixie-field"></div>
  </main>

  <section id="enclave" class="hidden">
    <p id="awareness-message">Awakening shared intelligence…</p>
  </section>

  <script src="scripts/landing.js"></script>
</body>
</html>
